# Render blueprint. Point a new Blueprint at this repo, or set these values by
# hand on an existing service.
services:
  - type: web
    name: dotnet-start
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    # Pick the region closest to your readers; a mismatched region costs more
    # round-trip time than anything in the application.
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      # Render injects PORT itself (10000 by default). Program.cs binds to it and
      # switches on forwarded-header handling when it is present, so nothing here
      # needs to hardcode a port.
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
