name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds the container and pushes it to GitHub Container Registry.
  # The result runs on anything that takes an image: Fly.io, Azure Container
  # Apps, Render, Cloud Run, a plain VPS.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs only once FLY_API_TOKEN is set in the repository secrets.
  # Until then this job is skipped, so the workflow stays green.
  fly:
    needs: image
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - id: guard
        run: echo "configured=${{ secrets.FLY_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.guard.outputs.configured != 'true'
        run: |
          echo "FLY_API_TOKEN is not set — skipping the Fly.io deploy." >> "$GITHUB_STEP_SUMMARY"
          echo "Run 'fly launch --no-deploy' locally, then add the token with:" >> "$GITHUB_STEP_SUMMARY"
          echo '`gh secret set FLY_API_TOKEN --body "$(fly tokens create deploy)"`' >> "$GITHUB_STEP_SUMMARY"

      - if: steps.guard.outputs.configured == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - if: steps.guard.outputs.configured == 'true'
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
