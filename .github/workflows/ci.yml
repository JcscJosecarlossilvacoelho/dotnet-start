name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish dotnet-start.csproj -c Release --no-build -o ./publish

      - name: Smoke test the docs routes
        run: |
          ASPNETCORE_URLS=http://127.0.0.1:5199 dotnet ./publish/dotnet-start.dll &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:5199/docs && break
            sleep 1
          done
          for path in / /skills /skills/aspnet-core /docs /docs/start/what-is-dotnet /search-index.json /sitemap.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:5199$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
          missing=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5199/docs/this-guide-does-not-exist)
          echo "/docs/this-guide-does-not-exist -> $missing"
          [ "$missing" = "404" ] || exit 1
          unknown=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5199/not-a-real-route)
          echo "/not-a-real-route -> $unknown"
          [ "$unknown" = "404" ] || exit 1
